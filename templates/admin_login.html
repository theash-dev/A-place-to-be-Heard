<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - A Place to Be Heard</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff0f5;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(180, 120, 145, 0.2);
            text-align: center;
        }

        h1 {
            color: #bd7891;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #e5c8d3;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #d99aae;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #c9869b;
        }

        .error {
            color: #c85c72;
            margin-bottom: 15px;
        }

        .heart {
            font-size: 35px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="heart">♡</div>

    <h1>Administrator</h1>

    <p>Welcome to A Place to Be Heard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="error">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Log In
        </button>

    </form>

</div>

</body>
</html>
